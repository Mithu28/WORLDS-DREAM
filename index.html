<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WORLDS-DREAM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg"></div>

  <main>
    <header class="logo">
      <span class="l1">WORLDS</span><span class="l2">DREAM</span>
      <small>Draft 1v1 · Édition Worlds 2023</small>
    </header>

    <!-- MENU -->
    <section id="menu" class="screen">
      <h2>1. Choisis un mode</h2>
      <div class="grid2">
        <button class="card sel" data-mode="three">
          <h3>Mode 3 équipes</h3>
          <p>À chaque poste, choisis parmi 3 joueurs de 3 équipes. Tu as 3 rerolls.</p>
        </button>
        <button class="card" data-mode="free">
          <h3>Mode libre</h3>
          <p>Choisis n'importe quel joueur, toi-même.</p>
        </button>
      </div>

      <h2>2. Contre qui ?</h2>
      <div class="grid2">
        <button class="card sel" data-opp="local">
          <h3>1v1 local</h3>
          <p>Deux joueurs sur le même écran.</p>
        </button>
        <button class="card" data-opp="ai">
          <h3>1v1 solo</h3>
          <p>Tu affrontes le programme.</p>
        </button>
      </div>

      <div id="aiOpts" class="hidden">
        <label>Difficulté du programme
          <select id="diff">
            <option value="easy">Facile</option>
            <option value="normal" selected>Normal</option>
            <option value="hard">Difficile</option>
          </select>
        </label>
      </div>

      <h2>3. Les noms</h2>
      <div class="grid2">
        <input id="n1" type="text" placeholder="Joueur 1" maxlength="16">
        <input id="n2" type="text" placeholder="Joueur 2" maxlength="16">
      </div>

      <button id="start" class="cta">Lancer la partie</button>
    </section>

    <!-- JEU -->
    <section id="game" class="screen hidden">
      <div class="bar">
        <div id="turn"></div>
        <div id="info"></div>
      </div>
      <div class="boards">
        <div class="board" id="b0"></div>
        <div class="board" id="b1"></div>
      </div>
      <div id="choices"></div>
    </section>

    <!-- RÉSULTAT -->
    <section id="result" class="screen hidden">
      <div id="winner" class="winner"></div>
      <div class="boards" id="finalBoards"></div>
      <div class="grid2">
        <button id="replay" class="cta">Rejouer</button>
        <button id="toMenu" class="cta ghost">Menu</button>
      </div>
    </section>
  </main>

  <script src="data.js"></script>
  <script src="game.js"></script>
</body>
</html>
